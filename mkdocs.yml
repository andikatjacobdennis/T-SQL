site_name: "T-SQL Tutorial"
#site_url: https://andikatjacobdennis.github.io/T-SQL/
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.reset
    - search.share
    - toc.integrate
    - toc.follow
    - toc.expand
    - navigation.top
    - navigation.footer
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.layout.wide
  palette:
    - scheme: default  # Light theme (default)
      primary: violet
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate  # Dark theme
      primary: violet
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Roboto
    code: Fira Code
extra:
  search:
    language: en
    pipeline: stemmer, stopword
    separator: '[\s\-]'
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/andikatjacobdennis/T-SQL
markdown_extensions:
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
      use_pygments: true
      pygments_style: vs  # Use Visual Studio Code highlighting
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.extra
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Foundations & Setup:
      - 001. History of SQL to Modern T-SQL: 001_History_of_SQL_to_modern_T_SQL.md
      - 002. Getting Started: 002_Getting_Started.md
      - 003. Installation: 003_Installation.md
      - 004. SQL Server Management Studio (SSMS) Walkthrough: 004_SQL_Server_Management_Studio_SSMS_Walkthrough.md

  - Core T-SQL Language:
      - 005. T-SQL DDL (Data Definition Language) Commands: 005_T_SQL_DDL_Data_Definition_Language_Commands.md
      - 006. T-SQL DML (Data Manipulation Language) Commands: 006_T_SQL_DML_Data_Manipulation_Language_Commands.md
      - 007. T-SQL DQL (Data Query Language) Commands: 007_T_SQL_DQL_Data_Query_Language_Commands.md
      - 008. T-SQL TCL (Transaction Control Language) Commands: 008_T_SQL_TCL_Transaction_Control_Language_Commands.md
      - 009. T-SQL DCL (Data Control Language) Commands: 009_T_SQL_DCL_Data_Control_Language_Commands.md

  - Advanced Topics:
      - 010. Indexing in T-SQL: 010_Indexing_in_T_SQL.md
      - 011. T-SQL Practice Problems: 011_T_SQL_Practice_Problems.md
      - 012. Frequently Asked Questions: 012_Frequently_Asked_Questions.md
      - 013. Glossary of Key Terms: 013_Glossary_of_Key_Terms.md

plugins:
  - search:
      lang: en
      separator: '[\s\-]'
  - tags
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

copyright: "&copy;2025. All rights reserved."